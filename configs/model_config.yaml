data:
  genomic_input_dim: 20513  # Hugo gene symbols after dedup (TCGA-BRCA mRNA)

fusion_bottleneck:
  query_dim: 512        # Genomic latent size
  key_value_dim: 768    # Image patch embedding size (CHIEF ViT-B)
  num_heads: 8
  dropout: 0.1
  hidden_dim: 512       # Post-attention projection layer

training:
  learning_rate: 0.0001
  epochs: 10        # actual trained epochs (trainer.py __main__ hardcodes this)
  batch_size: 4     # actual batch size used during training
  cv_folds: 5
