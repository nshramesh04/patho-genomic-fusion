project:
  type: website

website:
  title: "Patho-Genomic Fusion"
  description: >
    Asymmetric Cross-Attention Networks for Multimodal Integration in Pathology —
    PR-status classification in breast cancer via genomic-conditioned visual search.
  site-url: https://nshramesh04.github.io/patho-genomic-fusion
  repo-url: https://github.com/nshramesh04/patho-genomic-fusion
  repo-actions: [issue]
  open-graph: true
  navbar:
    background: dark
    left:
      - text: "Paper"
        href: paper.qmd
      - text: "Code"
        href: https://github.com/nshramesh04/patho-genomic-fusion
    right:
      - icon: github
        href: https://github.com/nshramesh04/patho-genomic-fusion
        aria-label: GitHub
  page-footer:
    left: "© 2026 Nisha Ramesh — Independent Research"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    fig-cap-location: bottom
    html-math-method: katex
    anchor-sections: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/ieee.csl
